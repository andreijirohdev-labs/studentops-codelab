when:
  - event: ["push", "pull_request"]
    branch: main

engine: nixery

dependenciesp:
  nixpkgs:
  - openjdk

steps:
  - name: Run fullNameChars code
    run: java -XX:+ShowCodeDetailsInExceptionMessages -cp "$PWD/java/out" dev.andreijiroh.studentops.projects.fullNameChars
  - name: Run CarDemo code
    run: java -XX:+ShowCodeDetailsInExceptionMessages -cp "$PWD/java/out" dev.andreijiroh.studentops.projects.CarDemo