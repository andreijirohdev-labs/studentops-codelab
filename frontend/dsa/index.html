<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Data Structures and Algorithms Lab</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Data Structures and Algorithms Labs</h1>
    <div class="tabContainer">
      <button class="tabButton active" type="button"
        onclick="openCity('profileTab', this)" aria-selected="true">Profile</button>
      <button class="tabButton" type="button"
        onclick="openCity('gradesTab', this)" aria-selected="false">Grades</button>
    </div>

    <div id="profileTab" class="tab">
      <form id="profileForm">
        <div id="surnameField">
          <label for="lastName">Surname</label><br>
          <input type="text" id="surname" name="surname"><br>
        </div>
        <div id="firstNameField">
          <label for="firstName">First name</label><br>
          <input type="text" id="firstName" name="firstName"><br>
        </div>
        <div id="middleInitialField">
          <label for="middleInitial">Middle initial</label><br>
          <input type="text" id="middleInitial" name="middleInitial"
          maxlength="4"><br>
        </div>
        <button id="submit" type="submit" value="Print">Print</button>
      </form>
      <p id="result"></p>
    </div>
    <div id="gradesTab" class="tab" style="display:none">
      <form id="gradesForm">
        <div id="gradesGrid">
          <div class="gradesHeader" aria-hidden="true">
            <span>Subject</span>
            <span>Grade</span>
          </div>
          <div class="gradeRow">
            <label for="subject1">Subject 1</label>
            <input type="text" id="subject1" name="subject">
            <label for="grade1">Grade 1</label>
            <input type="text" id="grade1" name="grade">
          </div>
          <div class="gradeRow">
            <label for="subject2">Subject 2</label>
            <input type="text" id="subject2" name="subject">
            <label for="grade2">Grade 2</label>
            <input type="text" id="grade2" name="grade">
          </div>
          <div class="gradeRow">
            <label for="subject3">Subject 3</label>
            <input type="text" id="subject3" name="subject">
            <label for="grade3">Grade 3</label>
            <input type="text" id="grade3" name="grade">
          </div>
          <div class="gradeRow">
            <label for="subject4">Subject 4</label>
            <input type="text" id="subject4" name="subject">
            <label for="grade4">Grade 4</label>
            <input type="text" id="grade4" name="grade">
          </div>
          <div class="gradeRow">
            <label for="subject5">Subject 5</label>
            <input type="text" id="subject5" name="subject">
            <label for="grade5">Grade 5</label>
            <input type="text" id="grade5" name="grade">
          </div>
          <div class="gradeRow">
            <label for="subject6">Subject 6</label>
            <input type="text" id="subject6" name="subject">
            <label for="grade6">Grade 6</label>
            <input type="text" id="grade6" name="grade">
          </div>
          <div class="gradeRow">
            <label for="subject7">Subject 7</label>
            <input type="text" id="subject7" name="subject">
            <label for="grade7">Grade 7</label>
            <input type="text" id="grade7" name="grade">
          </div>
          <div class="gradeRow">
            <label for="subject8">Subject 8</label>
            <input type="text" id="subject8" name="subject">
            <label for="grade8">Grade 8</label>
            <input type="text" id="grade8" name="grade">
          </div>
          <div class="gradeRow">
            <label for="subject9">Subject 9</label>
            <input type="text" id="subject9" name="subject">
            <label for="grade9">Grade 9</label>
            <input type="text" id="grade9" name="grade">
          </div>
        </div>
        <button id="submit" type="submit" value="Print">Save</button>
      </form>
      <div id="sortedResult">
      </div>
    </div>

    <script src="tabbedUi.js"></script>
    <script src="profileFormHandler.js"></script>
    <script src="gradesFormHandler.js"></script>
  </body>
</html>
