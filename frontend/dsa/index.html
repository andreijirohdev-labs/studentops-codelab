<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Data Structures and Algorithms Lab</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Data Structures and Algorithms Labs</h1>
    <div id="profileTab">
      <form id="profileForm">
        <div id="surnameField">
          <label for="lastName">Surname</label><br>
          <input type="text" id="surname" name="surname"><br>
        </div>
        <div id="firstNameField">
          <label for="firstName">First name</label><br>
          <input type="text" id="firstName" name="firstName"><br>
        </div>
        <div id="middleInitialField">
          <label for="middleInitial">Middle initial</label><br>
          <input type="text" id="middleInitial" name="middleInitial"
          maxlength="4"><br>
        </div>
        <button id="submit" type="submit" value="Print">Print</button>
      </form>

      <div id="dataResult">
        <p id="result"></p>
      </div>
    </div>

    <script src="profileFormHandler.js"></script>
  </body>
</html>
