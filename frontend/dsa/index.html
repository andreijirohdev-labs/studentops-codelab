<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Data Structures and Algorithms Lab</title>
  </head>
  <body>
    <h1>Data Structures and Algorithms Labs</h1>
    <form id="dataForm">
      <div id="surnameField">
        <label for="lastName">Surname</label><br>
        <input type="text" id="surname" name="surname"><br>
      </div>
      <div id="firstNameField">
        <label for="firstName">First name</label><br>
        <input type="text" id="firstName" name="firstName"><br>
      </div>
      <div id="middleInitialField">
        <label for="middleInitial">Middle initial</label><br>
        <input type="text" id="middleInitial" name="middleInitial"
        maxlength="4"><br>
      </div>
      <button id="submit" type="submit" value="Print">Print</button>
    </form>

    <div id="dataResult">
      <p id="result"></p>
    </div>

    <!-- styling between dark and light modes -->
    <style>
      :root {
        --bg-color: white;
        --text-color: black;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #1a1a1a;
          --text-color: white;
        }
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s ease-in;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-size: 1rem;
        width: 100%;
      }

      #dataForm {
        width: 150px;
        display: flex
      }

      #dataForm div {
        padding: 5px;
      }

      input {
        background-color: inherit;
        border: 1px solid white;
        width: 300px;
        color: inherit;
        margin-top: 5px;
      }

      #surname {
        width: 100px;
      }

      #firstName {
        width: 100px;
      }

      #middleInitial {
        width: 35px;
      }

      #submit {
        border-radius: 10px;
        margin: 10px;
        padding: 5px 10px;
      }
     </style>

    <!-- inline JS code for handling form input on submit -->
    <script>
      let form = document.getElementById("dataForm");
      let output = document.getElementById("result");

      /**
       * @param {SubmitEvent} event 
       */
      function handleFormSubmit(event) {
        // avoid the nightmare of page reloads
        event.preventDefault();

        const formData = new FormData(form);

        output.textContent = `${formData.get("surname")}, ${formData.get("firstName")} ${formData.get("middleInitial")}`
      }

      form.addEventListener("submit", handleFormSubmit)
    </script>
  </body>
</html>
